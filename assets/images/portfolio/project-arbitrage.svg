<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <rect width="500" height="300" rx="12" fill="#0c1322"/>
  <rect x="20" y="20" width="460" height="260" rx="8" stroke="#1e2f52" stroke-width="1.5" fill="#070b14"/>
  
  <!-- Cloud MiddleWare Architecture Diagram -->
  <rect x="40" y="110" width="100" height="60" rx="8" fill="#17243f" stroke="#2979ff" stroke-width="1.5"/>
  <text x="50" y="135" fill="#2979ff" font-family="sans-serif" font-size="10" font-weight="bold">TradingView</text>
  <text x="50" y="152" fill="#94a3b8" font-family="monospace" font-size="9">Webhook Alert</text>

  <!-- High Speed Router -->
  <circle cx="250" cy="140" r="35" fill="#121c32" stroke="#00e5ff" stroke-width="2"/>
  <text x="230" y="145" fill="#00e5ff" font-family="monospace" font-size="11" font-weight="bold">&lt; 140ms</text>

  <!-- Distribution Nodes -->
  <rect x="360" y="50" width="100" height="40" rx="6" fill="#17243f" stroke="#00e676" stroke-width="1"/>
  <text x="375" y="75" fill="#00e676" font-family="monospace" font-size="10">240x MT5 EAs</text>

  <rect x="360" y="120" width="100" height="40" rx="6" fill="#17243f" stroke="#00e676" stroke-width="1"/>
  <text x="375" y="145" fill="#00e676" font-family="monospace" font-size="10">180x MT4 EAs</text>

  <rect x="360" y="190" width="100" height="40" rx="6" fill="#17243f" stroke="#00e676" stroke-width="1"/>
  <text x="375" y="215" fill="#00e676" font-family="monospace" font-size="10">120x cTrader</text>

  <!-- Connecting Lines -->
  <path d="M 140,140 L 215,140" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 285,140 C 320,140 330,70 360,70" stroke="#00e676" stroke-width="2"/>
  <path d="M 285,140 L 360,140" stroke="#00e676" stroke-width="2"/>
  <path d="M 285,140 C 320,140 330,210 360,210" stroke="#00e676" stroke-width="2"/>
</svg>
