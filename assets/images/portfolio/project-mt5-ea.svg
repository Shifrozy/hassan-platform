<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <rect width="500" height="300" rx="12" fill="#0c1322"/>
  <rect x="20" y="20" width="460" height="260" rx="8" stroke="#1e2f52" stroke-width="1.5" fill="#070b14"/>
  
  <!-- Backtest Equity Curve -->
  <path d="M 40,240 L 90,210 L 130,225 L 180,170 L 220,185 L 280,130 L 340,140 L 400,90 L 460,60" stroke="#00e676" stroke-width="3" fill="none"/>
  <path d="M 40,240 L 90,210 L 130,225 L 180,170 L 220,185 L 280,130 L 340,140 L 400,90 L 460,60 L 460,260 L 40,260 Z" fill="url(#greenGradient)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Metric Badges Overlay -->
  <rect x="40" y="40" width="130" height="40" rx="6" fill="#121c32" stroke="#1e2f52" stroke-width="1"/>
  <text x="50" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">PROFIT FACTOR</text>
  <text x="50" y="73" fill="#00e676" font-family="monospace" font-size="16" font-weight="bold">2.34</text>

  <rect x="180" y="40" width="130" height="40" rx="6" fill="#121c32" stroke="#1e2f52" stroke-width="1"/>
  <text x="190" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">MAX DRAWDOWN</text>
  <text x="190" y="73" fill="#00e5ff" font-family="monospace" font-size="16" font-weight="bold">4.8%</text>
</svg>
