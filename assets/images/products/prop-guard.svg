<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="12" fill="#0c1322"/>
  <rect x="20" y="20" width="360" height="200" rx="8" stroke="#1e2f52" stroke-width="1.5" fill="#070b14"/>
  
  <!-- Target Progression Bar -->
  <text x="50" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Challenge Phase 1 Progress (Target: 8.0%)</text>
  <rect x="50" y="95" width="300" height="18" rx="9" fill="#121c32" stroke="#1e2f52" stroke-width="1"/>
  <rect x="50" y="95" width="240" height="18" rx="9" fill="url(#propGrad)"/>
  <text x="250" y="108" fill="#070b14" font-family="monospace" font-size="10" font-weight="bold">80% Reached</text>
  
  <text x="50" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Max Daily Drawdown Buffer</text>
  <rect x="50" y="155" width="300" height="18" rx="9" fill="#121c32" stroke="#1e2f52" stroke-width="1"/>
  <rect x="50" y="155" width="40" height="18" rx="9" fill="#00e676"/>
  <text x="100" y="168" fill="#94a3b8" font-family="monospace" font-size="10">0.8% used of 5.0% max</text>

  <defs>
    <linearGradient id="propGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
