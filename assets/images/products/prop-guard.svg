    </linearGradient>
  </defs>
  
  <!-- Title Badge -->
  <rect x="40" y="35" width="130" height="22" rx="4" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1"/>
  <text x="50" y="50" fill="#00e5ff" font-family="monospace" font-size="11" font-weight="bold">PROP CHALLENGE EA</text>
