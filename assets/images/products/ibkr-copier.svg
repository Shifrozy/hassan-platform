<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="12" fill="#0c1322"/>
  <rect x="20" y="20" width="360" height="200" rx="8" stroke="#1e2f52" stroke-width="1.5" fill="#070b14"/>
  
  <!-- Central Master Terminal -->
  <rect x="50" y="90" width="80" height="60" rx="6" fill="#17243f" stroke="#ef5350" stroke-width="1.5"/>
  <text x="65" y="115" fill="#ef5350" font-family="monospace" font-size="10" font-weight="bold">MASTER</text>
  <text x="60" y="135" fill="#cbd5e1" font-family="monospace" font-size="9">IBKR TWS</text>
  
  <!-- Slaves -->
  <rect x="270" y="45" width="80" height="45" rx="6" fill="#17243f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="285" y="65" fill="#00e5ff" font-family="monospace" font-size="9" font-weight="bold">SLAVE 1</text>
  <text x="285" y="80" fill="#94a3b8" font-family="monospace" font-size="8">1.5x Multiplier</text>
  
  <rect x="270" y="100" width="80" height="45" rx="6" fill="#17243f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="285" y="120" fill="#00e5ff" font-family="monospace" font-size="9" font-weight="bold">SLAVE 2</text>
  <text x="285" y="135" fill="#94a3b8" font-family="monospace" font-size="8">Prop Challenge</text>
  
  <rect x="270" y="155" width="80" height="45" rx="6" fill="#17243f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="285" y="175" fill="#00e5ff" font-family="monospace" font-size="9" font-weight="bold">SLAVE 3</text>
  <text x="285" y="190" fill="#94a3b8" font-family="monospace" font-size="8">Equities Fund</text>
  
  <!-- Direct Low-Latency Connections -->
  <path d="M 130,120 C 190,120 200,67 270,67" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 130,120 L 270,120" stroke="#00e676" stroke-width="2"/>
  <path d="M 130,120 C 190,120 200,177 270,177" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Title Badge -->
  <rect x="40" y="35" width="130" height="22" rx="4" fill="#ef5350" fill-opacity="0.15" stroke="#ef5350" stroke-width="1"/>
  <text x="50" y="50" fill="#ef5350" font-family="monospace" font-size="11" font-weight="bold">IBKR COPIER &lt; 5MS</text>
