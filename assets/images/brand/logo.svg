<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="#0c1322" stroke="url(#brandGrad)" stroke-width="3" />
  
  <!-- Algorithmic Candlestick & Node Graph -->
  <line x1="30" y1="22" x2="30" y2="78" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <rect x="25" y="38" width="10" height="24" rx="2" fill="#00e5ff" filter="url(#glow)" />
  
  <line x1="50" y1="18" x2="50" y2="82" stroke="#00e676" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <rect x="45" y="26" width="10" height="38" rx="2" fill="#00e676" filter="url(#glow)" />
  
  <line x1="70" y1="28" x2="70" y2="74" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <rect x="65" y="44" width="10" height="18" rx="2" fill="#00e5ff" filter="url(#glow)" />
  
  <!-- Connected Logic Line -->
  <polyline points="30,50 50,32 70,55" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="30" cy="50" r="3.5" fill="#ffffff" />
  <circle cx="50" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="70" cy="55" r="3.5" fill="#ffffff" />
</svg>
